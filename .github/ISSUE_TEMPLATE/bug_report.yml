name: Bug report
description: Report one reproducible Open Factor Android issue.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Describe one issue and the steps needed to reproduce it. Do not upload personal workout backups, progress photos, health records, signing credentials, or private spreadsheet content. Use synthetic examples and redact logs.
  - type: input
    id: app_version
    attributes:
      label: App version / commit
      placeholder: "0.6.2 or commit hash; source or static media build"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android version and device
      placeholder: "Android 15, Pixel 8; or emulator API 35"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workout logging / rest timers
        - Dashboard / customization / performance
        - Exercise search / guidance / video
        - Templates / programs
        - History / saved workout editing
        - Spreadsheet import / backups / data export
        - Body data / photos / Health Connect
        - Profile / settings / onboarding
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include synthetic data size, theme, and text scale if relevant.
      placeholder: "1. Open ...\n2. Tap ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include frequency and any visible error message.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs, screenshots, or recordings
      description: Crash logs are especially useful. Remove personal data before attaching evidence.
    validations:
      required: false
