name: Feature request
description: Propose an Open Factor improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Discuss large product or architecture changes before implementing them. Use synthetic examples rather than personal training or health data.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What is difficult or missing in the current workout app?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include mockups or synthetic examples, if useful.
    validations:
      required: false
