name: Open Factor Android
on:
  push:
    paths: ['openfactor/**', 'tooling/**', '.github/workflows/open-factor-android.yml']
  pull_request:
    paths: ['openfactor/**', 'tooling/**', '.github/workflows/open-factor-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: open-factor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openfactor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug -PopenfactorMediaMode=source
      - name: Verify public APK
        working-directory: .
        run: python3 tooling/verify_public_apk.py openfactor/app/build/outputs/apk/debug/app-debug.apk --output openfactor/app/build/reports/public-apk.json
      - uses: actions/upload-artifact@v4
        with:
          name: open-factor-debug
          path: openfactor/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-factor-build-reports
          path: |
            openfactor/app/build/reports/
            openfactor/app/build/test-results/
  device-tests:
    name: Android API ${{ matrix.api }} device tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    defaults:
      run:
        working-directory: openfactor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          working-directory: openfactor
          script: ./gradlew :app:connectedDebugAndroidTest -PopenfactorMediaMode=source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-factor-device-api-${{ matrix.api }}
          path: |
            openfactor/app/build/reports/androidTests/
            openfactor/app/build/outputs/androidTest-results/
