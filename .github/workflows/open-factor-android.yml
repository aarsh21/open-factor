name: Open Factor Android
on:
  push:
    paths: ['openfactor/**', 'tooling/**', '.github/workflows/open-factor-android.yml']
  pull_request:
    paths: ['openfactor/**', 'tooling/**', '.github/workflows/open-factor-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openfactor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: open-factor-debug
          path: openfactor/app/build/outputs/apk/debug/app-debug.apk
