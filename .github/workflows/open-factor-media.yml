name: Open Factor Media
on:
  # Branch work is checked through its pull request; pushes only run on main.
  push:
    branches: [main]
    paths: ['backend/media/**', 'tooling/upload_exercise_media.py', '.github/workflows/open-factor-media.yml']
  pull_request:
    paths: ['backend/media/**', 'tooling/upload_exercise_media.py', '.github/workflows/open-factor-media.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: open-factor-media-${{ github.ref }}
  # A newer commit replaces a pull request's run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/media
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: python3 test/uploader_test.py
      - run: docker build -t open-factor-media-contract .
